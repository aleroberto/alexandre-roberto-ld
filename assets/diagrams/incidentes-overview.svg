<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mapa visual da automação de incidentes</title>
  <desc id="desc">Uma Step Function falha, Python captura o contexto e abre um incidente no BMC Helix.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#0b1422"/><stop offset="1" stop-color="#10243b"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter></defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="70" y="95" fill="#8ce1f1" font-family="IBM Plex Mono, monospace" font-size="28" font-weight="600">MAPA VISUAL DA SOLUÇÃO</text>
  <text x="70" y="150" fill="#f2f7fb" font-family="DM Sans, Arial" font-size="54" font-weight="800">Da falha ao incidente com contexto</text>
  <text x="70" y="200" fill="#b5c6d3" font-family="DM Sans, Arial" font-size="28">Automação de uma etapa operacional para reduzir ação manual e acelerar a triagem.</text>
  <g filter="url(#shadow)">
    <rect x="120" y="330" width="300" height="200" rx="22" fill="#15263a" stroke="#35526c"/>
    <text x="155" y="380" fill="#8ce1f1" font-family="IBM Plex Mono, monospace" font-size="22">EVENTO</text>
    <text x="155" y="440" fill="#fff" font-family="DM Sans, Arial" font-size="36" font-weight="700">Step Functions</text>
    <text x="155" y="490" fill="#c1d0dc" font-family="DM Sans, Arial" font-size="24">falha de execução</text>

    <rect x="510" y="290" width="360" height="280" rx="22" fill="#18304a" stroke="#4c708d"/>
    <text x="545" y="340" fill="#9ce3f2" font-family="IBM Plex Mono, monospace" font-size="22">AUTOMAÇÃO</text>
    <text x="545" y="400" fill="#fff" font-family="DM Sans, Arial" font-size="36" font-weight="700">Python + API</text>
    <text x="545" y="450" fill="#c1d0dc" font-family="DM Sans, Arial" font-size="24">captura execution id, erro,</text>
    <text x="545" y="485" fill="#c1d0dc" font-family="DM Sans, Arial" font-size="24">etapa e contexto relevante</text>
    <text x="545" y="530" fill="#8ce1f1" font-family="DM Sans, Arial" font-size="24" font-weight="700">transforma falha em ação operacional</text>

    <rect x="960" y="330" width="300" height="200" rx="22" fill="#15263a" stroke="#35526c"/>
    <text x="995" y="380" fill="#8ce1f1" font-family="IBM Plex Mono, monospace" font-size="22">ATENDIMENTO</text>
    <text x="995" y="440" fill="#fff" font-family="DM Sans, Arial" font-size="36" font-weight="700">BMC Helix</text>
    <text x="995" y="490" fill="#c1d0dc" font-family="DM Sans, Arial" font-size="24">incidente com contexto</text>

    <rect x="1310" y="290" width="180" height="280" rx="22" fill="#12253b" stroke="#35526c"/>
    <text x="1340" y="340" fill="#8ce1f1" font-family="IBM Plex Mono, monospace" font-size="22">GANHO</text>
    <text x="1340" y="410" fill="#fff" font-family="DM Sans, Arial" font-size="28" font-weight="700">menos ação</text>
    <text x="1340" y="450" fill="#fff" font-family="DM Sans, Arial" font-size="28" font-weight="700">manual</text>
    <text x="1340" y="520" fill="#c1d0dc" font-family="DM Sans, Arial" font-size="22">triagem mais rápida</text>
  </g>
  <path d="M425 430 H495" stroke="#85dced" stroke-width="10" stroke-linecap="round"/><path d="M875 430 H945" stroke="#85dced" stroke-width="10" stroke-linecap="round"/><path d="M1265 430 H1295" stroke="#85dced" stroke-width="10" stroke-linecap="round"/>
</svg>
