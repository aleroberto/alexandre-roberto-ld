<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mapa visual da solução de Data Quality</title>
  <desc id="desc">Diagrama com três camadas de decisão: schema, qualidade de registros e dependências, com destinos distintos.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#0c1422"/><stop offset="1" stop-color="#112640"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter></defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="70" y="95" fill="#8ce1f1" font-family="IBM Plex Mono, monospace" font-size="28" font-weight="600">MAPA VISUAL DA SOLUÇÃO</text>
  <text x="70" y="150" fill="#f2f7fb" font-family="DM Sans, Arial" font-size="54" font-weight="800">Validar antes de integrar</text>
  <text x="70" y="200" fill="#b5c6d3" font-family="DM Sans, Arial" font-size="28">Três perguntas distintas: o arquivo está correto, o registro é válido e a dependência já existe?</text>
  <g filter="url(#shadow)">
    <rect x="110" y="320" width="370" height="330" rx="22" fill="#15263a" stroke="#35526c"/>
    <text x="145" y="370" fill="#8ce1f1" font-family="IBM Plex Mono, monospace" font-size="22">CAMADA 01</text>
    <text x="145" y="430" fill="#ffffff" font-family="DM Sans, Arial" font-size="36" font-weight="700">Schema</text>
    <text x="145" y="478" fill="#c1d0dc" font-family="DM Sans, Arial" font-size="24">Pergunta: o arquivo obedece ao contrato?</text>
    <text x="145" y="516" fill="#c1d0dc" font-family="DM Sans, Arial" font-size="24">Destino se falhar: rejeição estrutural</text>
    <rect x="145" y="555" width="210" height="48" rx="12" fill="#1f4256"/>
    <text x="170" y="587" fill="#dff6fb" font-family="DM Sans, Arial" font-size="22" font-weight="700">arquivo rejeitado</text>

    <rect x="615" y="260" width="370" height="390" rx="22" fill="#18304a" stroke="#4c708d"/>
    <text x="650" y="310" fill="#9ce3f2" font-family="IBM Plex Mono, monospace" font-size="22">CAMADA 02</text>
    <text x="650" y="370" fill="#ffffff" font-family="DM Sans, Arial" font-size="36" font-weight="700">Data Quality</text>
    <text x="650" y="418" fill="#c1d0dc" font-family="DM Sans, Arial" font-size="24">Pergunta: cada registro atende às regras?</text>
    <text x="650" y="456" fill="#c1d0dc" font-family="DM Sans, Arial" font-size="24">Nulidade, tipos, formatos, domínios,</text>
    <text x="650" y="490" fill="#c1d0dc" font-family="DM Sans, Arial" font-size="24">cardinalidade e consistência.</text>
    <rect x="650" y="540" width="250" height="48" rx="12" fill="#1f4256"/>
    <text x="675" y="572" fill="#dff6fb" font-family="DM Sans, Arial" font-size="22" font-weight="700">registros isolados</text>
    <rect x="650" y="600" width="200" height="48" rx="12" fill="#214a3c"/>
    <text x="675" y="632" fill="#e4f9ef" font-family="DM Sans, Arial" font-size="22" font-weight="700">registros válidos</text>

    <rect x="1120" y="320" width="370" height="330" rx="22" fill="#15263a" stroke="#35526c"/>
    <text x="1155" y="370" fill="#8ce1f1" font-family="IBM Plex Mono, monospace" font-size="22">CAMADA 03</text>
    <text x="1155" y="430" fill="#ffffff" font-family="DM Sans, Arial" font-size="36" font-weight="700">Dependências</text>
    <text x="1155" y="478" fill="#c1d0dc" font-family="DM Sans, Arial" font-size="24">Pergunta: o dado já pode ser integrado?</text>
    <text x="1155" y="516" fill="#c1d0dc" font-family="DM Sans, Arial" font-size="24">Se faltar entidade pai, ele aguarda.</text>
    <rect x="1155" y="555" width="170" height="48" rx="12" fill="#4a3d21"/>
    <text x="1180" y="587" fill="#fff3d9" font-family="DM Sans, Arial" font-size="22" font-weight="700">pendência</text>
    <rect x="1335" y="555" width="130" height="48" rx="12" fill="#214a3c"/>
    <text x="1360" y="587" fill="#e4f9ef" font-family="DM Sans, Arial" font-size="22" font-weight="700">integra</text>
  </g>
  <path d="M486 485 H595" stroke="#85dced" stroke-width="10" stroke-linecap="round"/>
  <path d="M992 485 H1100" stroke="#85dced" stroke-width="10" stroke-linecap="round"/>
</svg>
